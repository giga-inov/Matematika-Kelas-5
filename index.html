        // Fungsi Text-to-Speech Suara Bahasa Indonesia
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Fungsi Sinkronisasi Data ke Firebase secara Realtime
        async function syncToFirebase() {
            if (!gameState.studentName) return;
            try {
                await setDoc(doc(db, "artifacts", "coba-673353", "public", "data", "students_progress", gameState.studentName), {
                    name: gameState.studentName,
                    score: gameState.score,
                    currentQuestion: gameState.currentQuestionIndex + 1,
                    lives: gameState.lives,
                    status: gameState.page,
                    lastUpdated: new Date().toISOString()
                }, { merge: true });
            } catch (e) {
                console.error("Gagal sync firebase:", e);
            }
        }

                        <div class="space-y-4 text-left text-sm text-gray-700 mb-6">
                            <div class="p-4 bg-indigo-50 rounded-xl border border-indigo-200">
                                <h3 class="font-bold text-indigo-800 text-base mb-1">Bab 1: Bilangan Cacah sampai 100.000</h3>
                                <p>Membaca, menulis, nilai tempat, membandingkan, mengurutkan, serta dekomposisi angka. Contoh: 45.327 = 40.000 + 5.000 + 300 + 20 + 7.</p>
                            </div>
                            <div class="p-4 bg-indigo-50 rounded-xl border border-indigo-200">
                                <h3 class="font-bold text-indigo-800 text-base mb-1">Bab 2: Operasi Hitung Bilangan Cacah</h3>
                                <p>Penjumlahan, pengurangan, perkalian, pembagian, dan penyelesaian soal cerita sehari-hari dengan teliti.</p>
                            </div>
                            <div class="p-4 bg-indigo-50 rounded-xl border border-indigo-200">
                                <h3 class="font-bold text-indigo-800 text-base mb-1">Bab 3: KPK dan FPB</h3>
                                <p>Mengenal kelipatan & faktor bilangan, serta menghitung KPK dan FPB untuk menyelesaikan masalah kehidupan sehari-hari.</p>
                            </div>
                            <div class="p-4 bg-indigo-50 rounded-xl border border-indigo-200">
                                <h3 class="font-bold text-indigo-800 text-base mb-1">Bab 4: Pecahan</h3>
                                <p>Pecahan biasa & campuran, mengubah bentuk pecahan, membandingkan, mengurutkan, serta operasi hitung pecahan.</p>
                            </div>
                            <div class="p-4 bg-indigo-50 rounded-xl border border-indigo-200">
                                <h3 class="font-bold text-indigo-800 text-base mb-1">Bab 5: Keliling Bangun Datar</h3>
                                <p>Keliling persegi (4 × s), persegi panjang (2 × (p+l)), segitiga, dan bangun gabungan dalam kehidupan sehari-hari.</p>
                            </div>
                            <div class="p-4 bg-indigo-50 rounded-xl border border-indigo-200">
                                <h3 class="font-bold text-indigo-800 text-base mb-1">Bab 6: Luas Bangun Datar</h3>
                                <p>Luas persegi (s × s), persegi panjang (p × l), segitiga (1/2 × a × t), serta luas bangun gabungan.</p>
                            </div>
                        </div>

                        <button onclick="startQuizFromMaterial()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition">
                            📝 MULAI KUIS 50 SOAL
                        </button>
                    </div>
                `;
            } else if (gameState.page === 'quiz') {
                const q = gameState.shuffledQuestions[gameState.currentQuestionIndex];
                appDiv.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-xl border-4 border-indigo-300">
                        <div class="flex justify-between items-center mb-4 border-b pb-2">
                            <span class="text-sm font-bold text-indigo-600">Soal ${gameState.currentQuestionIndex + 1} dari 50</span>
                            <div class="flex items-center space-x-3">
                                <span class="text-sm font-bold text-red-500">Nyawa: ${'❤️'.repeat(gameState.lives)}</span>
                                <span class="text-sm font-bold text-emerald-600">Skor: ${gameState.score}</span>
                            </div>
                        </div>

                        <div class="mb-2 text-xs text-gray-500">Nama: ${gameState.studentName}</div>
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">${q.q}</h3>

                        <div class="space-y-3 mb-6">
                            ${q.options.map((opt, idx) => `
                                <button onclick="answerQuestion(${idx})" class="w-full text-left p-3 rounded-xl border-2 border-indigo-100 hover:bg-indigo-50 hover:border-indigo-400 font-medium transition">
                                    <span class="font-bold mr-2 text-indigo-600">${['A', 'B', 'C', 'D'][idx]}.</span>${opt}
                                </button>
                            `).join('')}
                        </div>

                        <div class="text-center">
                            <button onclick="returnToMaterial()" class="text-xs bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded-lg shadow transition">
                                📚 KEMBALI KE MATERI
                            </button>
                        </div>
                    </div>
                `;
            } else if (gameState.page === 'feedback') {
                const q = gameState.shuffledQuestions[gameState.currentQuestionIndex];
                const isCorrect = gameState.lastResultCorrect;
                appDiv.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-xl border-4 border-indigo-300 text-center">
                        <div class="text-5xl mb-2">${isCorrect ? '✅' : '❌'}</div>
                        <h3 class="text-2xl font-bold ${isCorrect ? 'text-emerald-600' : 'text-red-600'} mb-2">
                            ${isCorrect ? 'BENAR!' : 'BELUM TEPAT'}
                        </h3>
                        <p class="text-gray-700 font-medium mb-4">${isCorrect ? `Hebat, ${gameState.studentName}!` : `${gameState.studentName}, jangan menyerah!`}</p>
                        
                        <div class="bg-indigo-50 p-4 rounded-xl text-left text-sm text-gray-700 mb-6 border border-indigo-200">
                            <p class="font-bold mb-1">Pembahasan:</p>
                            <p>${q.explanation}</p>
                        </div>

                        <button onclick="nextQuestion()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition">
                            SOAL BERIKUTNYA ➔
                        </button>
                    </div>
                `;
            } else if (gameState.page === 'gameOver') {
                appDiv.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl shadow-xl text-center border-4 border-red-300">
                        <div class="text-6xl mb-4">💔</div>
                        <h2 class="text-2xl font-bold text-red-600">NYAWA HABIS!</h2>
                        <p class="text-gray-600 mb-6">Jangan berkecil hati, ${gameState.studentName}. Yuk pelajari materinya lagi agar semakin pintar!</p>
                        <div class="space-y-3">
                            <button onclick="gameState.page='material'; render();" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-6 rounded-xl shadow transition">
                                📚 PELAJARI MATERI KEMBALI
                            </button>
                            <button onclick="restartQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow transition">
                                🔄 ULANGI KUIS DARI AWAL
                            </button>
                        </div>
                    </div>
                `;
            } else if (gameState.page === 'finished') {
                appDiv.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl shadow-xl text-center border-4 border-indigo-300">
                        <div class="text-5xl mb-3">🎉</div>
                        <h2 class="text-2xl font-bold text-indigo-700 mb-2">KUIS SELESAI!</h2>
                        <p class="text-gray-600 mb-4">Selamat, ${gameState.studentName}! Kamu telah menyelesaikan 50 soal.</p>
                        
                        <div class="bg-indigo-50 p-4 rounded-xl mb-6 text-indigo-900 font-semibold space-y-1">
                            <p>Skor Kamu: <span class="text-2xl text-indigo-700">${gameState.score}</span> / 1000</p>
                            <p>Jawaban Benar: ${gameState.score / 20} dari 50 soal</p>
                            <p>Jawaban Salah: ${50 - (gameState.score / 20)}</p>
                        </div>

                        <div class="space-y-3">
                            <button onclick="gameState.page='certificate'; render();" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl shadow transition">
                                🏆 LIHAT SERTIFIKAT PENGHARGAAN
                            </button>
                            <button onclick="restartQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow transition">
                                🔄 ULANGI KUIS
                            </button>
                        </div>
                    </div>
                `;
            } else if (gameState.page === 'certificate') {
                const today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                appDiv.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-2xl border-8 border-amber-400 text-center relative">
                        <h3 class="text-xs uppercase tracking-widest text-gray-500 font-bold mb-1">Sertifikat Penghargaan Resmi</h3>
                        <h1 class="text-2xl font-bold text-indigo-800 mb-2 font-serif">SERTIFIKAT PENGHARGAAN</h1>
                        <p class="text-xs text-gray-600 mb-3">Diberikan kepada:</p>
                        <h2 class="text-2xl font-bold text-indigo-600 border-b-2 border-indigo-200 pb-1 inline-block px-6 mb-3">${gameState.studentName}</h2>
                        <p class="text-xs text-gray-600 mb-3">atas keberhasilannya menyelesaikan</p>
                        <h4 class="font-bold text-gray-800 text-sm mb-3">"PETUALANGAN MATEMATIKA KELAS 5 SD/MI"</h4>
                        
                        <div class="bg-indigo-50 p-3 rounded-lg text-xs text-indigo-900 mb-4 max-w-xs mx-auto space-y-1">
                            <p>Skor Total: <b>${gameState.score} / 1000</b></p>
                            <p>Jawaban Benar: <b>${gameState.score / 20} dari 50 soal</b></p>
                            <p>Tanggal: <b>${today}</b></p>
                        </div>

                        <div class="mt-6 pt-3 border-t border-gray-200 text-xs text-gray-600">
                            <p>Pengembang</p>
                            <p class="font-bold text-indigo-700">Giga Inovation</p>
                            <p>081329200985</p>
                        </div>

                        <div class="mt-6">
                            <button onclick="gameState.page='finished'; render();" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-xl shadow text-sm">
                                ↩ Kembali ke Hasil
                            </button>
                        </div>
                    </div>
                `;
            } else if (gameState.page === 'teacherDashboard') {
                appDiv.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-xl border-4 border-emerald-300">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-bold text-emerald-700">👨‍🏫 Mode Guru (Realtime Monitoring)</h2>
                            <button onclick="gameState.page='home'; render();" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-1 rounded-lg text-xs font-bold">Kembali</button>
                        </div>
                        <p class="text-xs text-gray-500 mb-4">Menampilkan progres siswa yang sedang mengerjakan game secara langsung dari Firebase.</p>
                        <div id="studentListContainer" class="space-y-3 max-h-[60vh] overflow-y-auto">
                            <p class="text-sm text-gray-500 text-center py-4">Memuat data siswa...</p>
                        </div>
                    </div>
                `;
                listenRealtimeStudents();
            }
        };

        window.saveName = function() {
            const nameInput = document.getElementById('studentNameInput').value.trim();
            if (!nameInput) {
                alert("Silakan masukkan nama kamu terlebih dahulu!");
                return;
            }
            gameState.studentName = nameInput;
            gameState.page = 'welcome';
            speak(`Halo, ${gameState.studentName}! Selamat datang di Petualangan Matematika Kelas 5.`);
            render();
        };

        window.startLearning = function() {
            gameState.page = 'material';
            render();
        };

        window.startQuizFromMaterial = function() {
            // Acak dan ambil 50 soal penuh
            gameState.shuffledQuestions = [...allQuestions].sort(() => 0.5 - Math.random());
            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            gameState.lives = 3;
            gameState.page = 'quiz';
            speak(`Baik, ${gameState.studentName}. Mari kita mulai kuis matematika.`);
            render();
        };

        window.returnToMaterial = function() {
            gameState.lastQuizIndex = gameState.currentQuestionIndex;
            gameState.page = 'material';
            render();
        };

        window.answerQuestion = function(selectedIndex) {
            const q = gameState.shuffledQuestions[gameState.currentQuestionIndex];
            const isCorrect = (selectedIndex === q.correct);
            gameState.lastResultCorrect = isCorrect;

            if (isCorrect) {
                gameState.score += 20;
                speak(`Benar, ${gameState.studentName}! Hebat sekali! Jawaban kamu tepat.`);
            } else {
                gameState.lives -= 1;
                speak(`Belum tepat, ${gameState.studentName}. Yuk, pelajari kembali cara menghitungnya.`);
            }

            gameState.page = 'feedback';
            render();
        };

        window.nextQuestion = function() {
            if (gameState.lives <= 0) {
                gameState.page = 'gameOver';
                speak(`Sayang sekali, nyawa kamu habis. Semangat ya, ${gameState.studentName}!`);
                render();
                return;
            }

            gameState.currentQuestionIndex++;
            if (gameState.currentQuestionIndex >= gameState.shuffledQuestions.length) {
                gameState.page = 'finished';
                speak(`Selamat, ${gameState.studentName}! Kamu telah menyelesaikan 50 soal dengan skor ${gameState.score}.`);
            } else {
                gameState.page = 'quiz';
                speak(`Bagus, ${gameState.studentName}. Sekarang kita lanjut ke soal berikutnya.`);
            }
            render();
        };

        window.restartQuiz = function() {
            gameState.shuffledQuestions = [...allQuestions].sort(() => 0.5 - Math.random());
            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            gameState.lives = 3;
            gameState.page = 'quiz';
            render();
        };

        // Realtime Listener untuk Mode Guru
        function listenRealtimeStudents() {
            onSnapshot(collection(db, "artifacts", "coba-673353", "public", "data", "students_progress"), (snapshot) => {
                const container = document.getElementById('studentListContainer');
                if (!container) return;
                
                if (snapshot.empty) {
                    container.innerHTML = `<p class="text-sm text-gray-500 text-center py-4">Belum ada siswa yang aktif bermain.</p>`;
                    return;
                }

                let html = '';
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    html += `
                        <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-200 flex justify-between items-center text-sm">
                            <div>
                                <p class="font-bold text-emerald-900">👤 ${data.name}</p>
                                <p class="text-xs text-gray-600">Soal ke: <b>${data.currentQuestion} / 50</b> | Nyawa: <b>${'❤️'.repeat(data.lives || 0)}</b></p>
                            </div>
                            <div class="text-right">
                                <span class="bg-emerald-600 text-white font-bold py-1 px-3 rounded-lg text-xs">Skor: ${data.score}</span>
                                <p class="text-[10px] text-gray-400 mt-1">Status: ${data.status}</p>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        // Render Pertama Kali
        render();
    </script>
</body>
</html>
