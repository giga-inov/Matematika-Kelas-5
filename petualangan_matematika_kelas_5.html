            APP_STATE.fromQuizToMaterial = true;
            APP_STATE.step = 5;
            render();
            speakText(`Silakan membaca materi kembali, ${APP_STATE.studentName}. Skor dan posisi soal kamu aman tersimpan.`);
        }

        function backToQuiz() {
            APP_STATE.fromQuizToMaterial = false;
            APP_STATE.step = 7;
            render();
            speakText(`Kembali ke kuis, ${APP_STATE.studentName}. Lanjutkan kerja bagusmu!`);
        }

        function selectOption(idx) {
            const qIdx = APP_STATE.currentQuestionIndex;
            const q = QUIZ_QUESTIONS[qIdx];
            APP_STATE.answers[qIdx] = idx;

            const isCorrect = idx === q.answer;
            if (isCorrect) {
                APP_STATE.score += 20;
                APP_STATE.correctCount += 1;
                speakText(`Benar, ${APP_STATE.studentName}! Hebat sekali! Jawaban kamu tepat.`);
            } else {
                APP_STATE.wrongCount += 1;
                const correctLetter = String.fromCharCode(65 + q.answer);
                speakText(`Belum tepat, ${APP_STATE.studentName}. Jangan menyerah. Jawaban yang benar adalah ${correctLetter}.`);
            }

            render();
        }

        function nextQuestion() {
            if (APP_STATE.currentQuestionIndex < QUIZ_QUESTIONS.length - 1) {
                APP_STATE.currentQuestionIndex += 1;
                render();
                
                const transitionPhrases = [
                    `Bagus, ${APP_STATE.studentName}. Sekarang kita lanjut ke soal berikutnya.`,
                    `Hebat, ${APP_STATE.studentName}! Mari lanjut ke soal berikutnya.`,
                    `Semangat, ${APP_STATE.studentName}! Ini soal selanjutnya ya.`
                ];
                const randomPhrase = transitionPhrases[Math.floor(Math.random() * transitionPhrases.length)];
                speakText(randomPhrase);
            } else {
                APP_STATE.step = 8;
                render();
                
                const finalScore = APP_STATE.score;
                speakText(`Selamat, ${APP_STATE.studentName}! Kamu telah menyelesaikan 50 soal. Skor kamu adalah ${finalScore} dari 1000.`);
            }
        }

        // 8. Results Page
        function renderResultsPage(container) {
            const score = APP_STATE.score;
            const correct = APP_STATE.correctCount;
            const wrong = APP_STATE.wrongCount;
            let praiseMsg = "";
            let badgeColor = "bg-indigo-100 text-indigo-800 border-indigo-300";

            if (score >= 850) {
                praiseMsg = `Hebat sekali, ${APP_STATE.studentName}! Penguasaan matematikamu sangat luar biasa! Terus pertahankan prestasi hebatmu.`;
            } else if (score >= 600) {
                praiseMsg = `Kerja bagus, ${APP_STATE.studentName}! Kamu sudah belajar dengan giat. Terus tingkatkan kemampuan matematikamu!`;
            } else {
                praiseMsg = `Semangat, ${APP_STATE.studentName}! Jangan menyerah. Kamu bisa membaca materi kembali dan mengulangi kuis untuk hasil yang lebih gemilang!`;
                badgeColor = "bg-amber-100 text-amber-800 border-amber-300";
            }

            container.innerHTML = `
                <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 max-w-lg w-full text-center border border-indigo-100 my-auto">
                    <div class="inline-block p-4 bg-indigo-100 text-indigo-600 rounded-full mb-4 shadow-inner">
                        <i class="fa-solid fa-trophy text-4xl"></i>
                    </div>
                    <h2 class="heading-font text-2xl md:text-3xl font-extrabold text-slate-800 mb-1">🎉 KUIS SELESAI! 🎉</h2>
                    <p class="text-slate-600 text-sm mb-6">Petualangan 50 Soal Matematika Kelas 5</p>

                    <div class="p-6 bg-slate-50 border border-slate-200 rounded-2xl mb-6 space-y-4">
                        <div>
                            <span class="text-xs uppercase tracking-wider text-slate-400 font-bold block mb-1">Nama Siswa</span>
                            <span class="text-xl font-extrabold text-slate-800">${APP_STATE.studentName}</span>
                        </div>
                        <div class="flex justify-center gap-3">
                            <div class="bg-white p-3 rounded-xl border border-slate-200 flex-1">
                                <span class="text-xs text-slate-400 block font-bold">SKOR</span>
                                <span class="text-2xl font-extrabold text-indigo-600">${score}</span>
                                <span class="text-xs text-slate-500">/ 1000</span>
                            </div>
                            <div class="bg-white p-3 rounded-xl border border-slate-200 flex-1">
                                <span class="text-xs text-slate-400 block font-bold">BENAR</span>
                                <span class="text-2xl font-extrabold text-emerald-600">${correct}</span>
                                <span class="text-xs text-slate-500">/ 50</span>
                            </div>
                            <div class="bg-white p-3 rounded-xl border border-slate-200 flex-1">
                                <span class="text-xs text-slate-400 block font-bold">SALAH</span>
                                <span class="text-2xl font-extrabold text-rose-500">${wrong}</span>
                                <span class="text-xs text-slate-500">/ 50</span>
                            </div>
                        </div>
                    </div>

                    <div class="p-4 rounded-2xl border ${badgeColor} text-sm font-semibold mb-6 leading-relaxed">
                        ${praiseMsg}
                    </div>

                    <div class="space-y-3">
                        <button onclick="goToCertificate()" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-blue-600 text-white font-bold rounded-2xl shadow-lg hover:from-indigo-700 hover:to-blue-700 transition text-base flex items-center justify-center gap-2">
                            <i class="fa-solid fa-award"></i> 🏆 LIHAT SERTIFIKAT PENGHARGAAN
                        </button>
                        <button onclick="restartGame()" class="w-full py-3 bg-slate-100 text-slate-700 font-bold rounded-2xl hover:bg-slate-200 transition text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-rotate-right"></i> 🔄 ULANGI KUIS
                        </button>
                    </div>
                </div>
            `;
        }

        function goToCertificate() {
            APP_STATE.step = 9;
            render();
            speakText(`Selamat, ${APP_STATE.studentName}! Sertifikat penghargaan matematika kamu telah diterbitkan.`);
        }

        // 9. Certificate Page
        function renderCertificatePage(container) {
            const currentDate = new Date().toLocaleDateString('id-ID', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });

            container.innerHTML = `
                <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-10 max-w-3xl w-full my-auto border-8 border-double border-amber-400 relative text-center flex flex-col justify-between">
                    <!-- Certificate Watermarks -->
                    <div class="absolute top-4 left-4 text-amber-500 text-2xl"><i class="fa-solid fa-star"></i></div>
                    <div class="absolute top-4 right-4 text-amber-500 text-2xl"><i class="fa-solid fa-star"></i></div>

                    <div>
                        <div class="text-indigo-700 font-extrabold tracking-widest text-xs md:text-sm uppercase mb-1">KEMENTERIAN PENDIDIKAN • KURIKULUM MERDEKA</div>
                        <h1 class="heading-font text-3xl md:text-4xl font-black text-slate-900 tracking-wide mb-2 uppercase">SERTIFIKAT PENGHARGAAN</h1>
                        <p class="text-xs md:text-sm text-slate-500 italic mb-6">Nomor: CERT/${Math.floor(Math.random()*89999 + 10000)}/MATH/2026</p>

                        <p class="text-sm md:text-base text-slate-600 mb-2">Sertifikat ini dengan bangga diberikan kepada:</p>
                        
                        <div class="my-3 inline-block border-b-4 border-indigo-600 pb-1 px-8">
                            <h2 class="heading-font text-3xl md:text-4xl font-black text-indigo-800 tracking-wider uppercase">${APP_STATE.studentName}</h2>
                        </div>

                        <p class="text-sm md:text-base text-slate-600 max-w-xl mx-auto mb-4 leading-relaxed">
                            Atas keberhasilannya menyelesaikan seluruh rangkaian materi dan kuis dalam:
                        </p>

                        <h3 class="heading-font text-lg md:text-xl font-extrabold text-blue-900 mb-6 bg-blue-50 py-3 px-6 rounded-2xl border border-blue-200 inline-block">
                            "PETUALANGAN MATEMATIKA KELAS 5 SD/MI"
                        </h3>

                        <div class="flex flex-wrap justify-center gap-4 mb-8 text-sm md:text-base font-semibold text-slate-700">
                            <div class="bg-slate-50 px-4 py-2 rounded-xl border border-slate-200">
                                Skor: <span class="text-indigo-600 font-extrabold">${APP_STATE.score}</span> / 1000
                            </div>
                            <div class="bg-slate-50 px-4 py-2 rounded-xl border border-slate-200">
                                Jawaban Benar: <span class="text-emerald-600 font-extrabold">${APP_STATE.correctCount}</span> dari 50 soal
                            </div>
                            <div class="bg-slate-50 px-4 py-2 rounded-xl border border-slate-200">
                                Tanggal: <span class="text-slate-900 font-extrabold">${currentDate}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Footer Certificate with required Developer watermark -->
                    <div class="pt-6 border-t border-slate-200 flex flex-col md:flex-row items-center justify-between text-xs text-slate-500 gap-4">
                        <div class="text-left">
                            <p class="font-bold text-slate-700">Wali Kelas / Guru Pengampu</p>
                            <div class="h-8"></div>
                            <p class="border-t border-slate-400 pt-1 font-semibold">Guru Matematika Kelas 5</p>
                        </div>
                        
                        <!-- Required Developer Watermark on Certificate -->
                        <div class="text-center md:text-right bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                            <p class="font-bold text-slate-700">Pengembang</p>
                            <p class="font-extrabold text-indigo-700">Giga Inovation</p>
                            <p class="text-[11px] text-slate-500">081329200985</p>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons Outside Certificate -->
                <div class="mt-6 flex flex-wrap gap-3 justify-center w-full max-w-3xl">
                    <button onclick="window.print()" class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg hover:bg-indigo-700 transition text-sm flex items-center gap-2">
                        <i class="fa-solid fa-print"></i> CETAK / SIMPAN SERTIFIKAT
                    </button>
                    <button onclick="restartGame()" class="px-6 py-3 bg-slate-200 text-slate-700 font-bold rounded-2xl hover:bg-slate-300 transition text-sm flex items-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> MAIN LAGI DARI AWAL
                    </button>
                </div>
            `;
        }

        function restartGame() {
            APP_STATE.step = 7; // Direct to question 1 with preserved name
            APP_STATE.currentQuestionIndex = 0;
            APP_STATE.score = 0;
            APP_STATE.correctCount = 0;
            APP_STATE.wrongCount = 0;
            APP_STATE.answers = {};
            APP_STATE.fromQuizToMaterial = false;
            render();
            speakText(`Kuis diulang kembali dari awal, ${APP_STATE.studentName}. Semangat!`);
        }

        // Initialize on window load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
